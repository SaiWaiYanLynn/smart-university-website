<text x="80" y="1140" font-size="14" fill="#27272A" >Every role also does everything a guest does.</text>
<text x="80" y="1166" font-size="14" fill="#27272A" font-weight="700">Rules that apply to every use case with the assistant:</text>
<text x="80" y="1192" font-size="14" fill="#27272A" >include: Check the role and the rows.   include: Cite the source document, for a policy answer.</text>
<text x="80" y="1218" font-size="14" fill="#27272A" >include: Confirm before writing, for every write.   include: Write an audit record, for every write and every personal read.</text>
<text x="80" y="1244" font-size="14" fill="#27272A" >A person decides every payment slip. The assistant records it only after a yes.</text>
